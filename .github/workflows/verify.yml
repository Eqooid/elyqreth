name: Elyqreth quality verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
        env:
          POSTGRES_USER: elyqreth_test
          POSTGRES_PASSWORD: elyqreth_ci_test_only_password
          POSTGRES_DB: postgres
        ports:
          - 5432/tcp
        options: >-
          --label elyqreth.test.service=phase1
          --health-cmd "pg_isready -U elyqreth_test -d postgres"
          --health-interval 1s
          --health-timeout 2s
          --health-retries 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Validate security policies
        run: |
          python3 -m venv "$RUNNER_TEMP/ci-yaml"
          "$RUNNER_TEMP/ci-yaml/bin/python" -m pip install PyYAML==6.0.2
          "$RUNNER_TEMP/ci-yaml/bin/python" scripts/check-release-workflows.py
          python3 -m unittest discover -s docs/ai-agent-platform/phase-6/verification-evidence -p test_check_configuration.py
          python3 docs/ai-agent-platform/phase-6/verification-evidence/check_configuration.py
      - name: Build
        run: |
          npm run build
          npm run build:web
      - name: Test
        run: |
          npm run verify:phase1:tests
          npm run test:security:compiled --workspace=@elyqreth/api
        env:
          CI_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          CI_POSTGRES_PASSWORD: elyqreth_ci_test_only_password
          BROWSER_PATH: /usr/bin/google-chrome
          BROWSER_HARDENING_PHASE4: 'true'
          TMPDIR: ${{ runner.temp }}
