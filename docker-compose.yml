name: elyqreth
x-api-environment: &api-environment
  NODE_ENV: development
  API_HOST: 0.0.0.0
  API_PORT: "3001"
  CORS_ORIGINS: http://127.0.0.1:${WEB_PORT:-8080},http://localhost:${WEB_PORT:-8080}
  POSTGRES_USER: ${POSTGRES_USER:-elyqreth}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the ignored root .env}
  POSTGRES_DB: ${POSTGRES_DB:-elyqreth}
  AGENT_REGISTRY_ENABLED: "false"
  CITY_READ_ENABLED: "false"
  RUNTIME_ENABLED: "false"
  RUNTIME_LLM_ENABLED: "false"
  RUNTIME_TOOLS_ENABLED: "false"
services:
  web:
    build:
      context: .
      target: web
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
  migrate:
    build:
      context: .
      target: api
    environment: *api-environment
    command: ["node", "docker/api-start.cjs", "migrate"]
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"
  api:
    build:
      context: .
      target: api
    environment: *api-environment
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    stop_grace_period: 15s
  postgres:
    image: postgres:17.11-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-elyqreth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the ignored root .env}
      POSTGRES_DB: ${POSTGRES_DB:-elyqreth}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
volumes:
  postgres_data:
