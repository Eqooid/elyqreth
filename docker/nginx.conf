worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Static requests also cross the public edge: never log raw query/referrer/header values.
    log_format safe_static escape=json '{"component":"web","requestId":"$request_id","method":"$request_method","status":$status,"duration":$request_time}';
    access_log /dev/stdout safe_static;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    sendfile on;
    server_tokens off;
    server {
        listen 8080;
        server_name _;
        # Preserve the public TLS origin when this private static server adds a directory slash.
        absolute_redirect off;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control no-cache always;
        location = /health { access_log off; default_type text/plain; return 200 "ok\n"; }
        location = /access-config.json { default_type application/json; alias /tmp/elyqreth-public-access.json; }
        location / { try_files $uri $uri/ =404; }
        location ~ /\. { deny all; }
    }
}
